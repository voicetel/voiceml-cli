name: release

# Builds + publishes the voiceml-cli release artifacts when a v* tag is pushed.
# Delegates the build matrix to ./Makefile (`make release`) so the local
# `make release` and the CI release produce byte-identical archives.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Stable toolchain: release binaries must not ship from an EOL
          # Go (the v0.2.0 binary was go1.23 with 57 known stdlib CVEs).
          go-version: "stable"

      - name: Build all platforms + package
        run: make release

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz dist/*.zip --clobber
          else
            gh release create "$tag" \
              --title "VoiceML CLI $tag" \
              --generate-notes \
              dist/*.tar.gz dist/*.zip
          fi
