# golangci-lint v2 configuration. Run locally with:
#
#   golangci-lint run ./...

version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - gocritic
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
  settings:
    gosec:
      excludes:
        - G104
        - G115
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
  exclusions:
    rules:
      - path: 'internal/output/output\.go'
        linters:
          - errcheck
      - path: 'loop\.go'
        linters:
          - errcheck
