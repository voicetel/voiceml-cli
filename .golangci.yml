# golangci-lint v2 configuration. Run locally with:
#
#   golangci-lint run ./...

version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
